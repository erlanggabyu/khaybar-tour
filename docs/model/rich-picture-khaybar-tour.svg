<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <style>
      .bg{fill:#f6f8fb}
      .title{font:700 42px Arial, sans-serif;fill:#0f172a}
      .subtitle{font:400 22px Arial, sans-serif;fill:#475569}
      .box{fill:#fff;stroke:#d6dee8;stroke-width:2;rx:24;filter:url(#shadow)}
      .actor{fill:#e7f5f0;stroke:#0b5d49;stroke-width:3;rx:24}
      .admin{fill:#fff7ed;stroke:#c2410c;stroke-width:3;rx:24}
      .db{fill:#eff6ff;stroke:#1d4ed8;stroke-width:3;rx:24}
      .process{fill:#ffffff;stroke:#94a3b8;stroke-width:2;rx:18}
      .warn{fill:#fff7ed;stroke:#f97316;stroke-width:2;rx:18}
      .success{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:18}
      .text{font:600 18px Arial, sans-serif;fill:#0f172a}
      .small{font:400 15px Arial, sans-serif;fill:#475569}
      .tiny{font:400 13px Arial, sans-serif;fill:#64748b}
      .label{font:700 16px Arial, sans-serif;fill:#0b5d49}
      .arrow{stroke:#0b5d49;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .arrow2{stroke:#f97316;stroke-width:4;fill:none;marker-end:url(#arrow2);stroke-dasharray:8 8}
      .arrow3{stroke:#2563eb;stroke-width:4;fill:none;marker-end:url(#arrow3)}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#0b5d49"/>
    </marker>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#f97316"/>
    </marker>
    <marker id="arrow3" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="1000"/>
  <text x="800" y="70" text-anchor="middle" class="title">Rich Picture Sistem Pendaftaran Umroh Khaybar Tour</text>
  <text x="800" y="108" text-anchor="middle" class="subtitle">Gambaran aktor, proses bisnis, keputusan pembayaran, dokumen, invoice, laporan, dan database</text>

  <rect x="55" y="185" width="250" height="220" class="actor"/>
  <text x="180" y="225" text-anchor="middle" class="text">Calon Pelanggan</text>
  <circle cx="180" cy="290" r="45" fill="#0b5d49" opacity=".16"/>
  <text x="180" y="300" text-anchor="middle" font-size="50">U</text>
  <text x="180" y="360" text-anchor="middle" class="small">Lihat paket</text>
  <text x="180" y="384" text-anchor="middle" class="small">Registrasi akun</text>

  <rect x="55" y="535" width="250" height="220" class="actor"/>
  <text x="180" y="575" text-anchor="middle" class="text">Pelanggan</text>
  <circle cx="180" cy="640" r="45" fill="#0b5d49" opacity=".16"/>
  <text x="180" y="650" text-anchor="middle" font-size="50">P</text>
  <text x="180" y="710" text-anchor="middle" class="small">Daftar paket</text>
  <text x="180" y="734" text-anchor="middle" class="small">Bayar dan upload</text>

  <rect x="1285" y="310" width="250" height="260" class="admin"/>
  <text x="1410" y="350" text-anchor="middle" class="text">Admin</text>
  <circle cx="1410" cy="420" r="45" fill="#f97316" opacity=".18"/>
  <text x="1410" y="430" text-anchor="middle" font-size="50">A</text>
  <text x="1410" y="492" text-anchor="middle" class="small">Kelola paket</text>
  <text x="1410" y="516" text-anchor="middle" class="small">Verifikasi dokumen</text>
  <text x="1410" y="540" text-anchor="middle" class="small">Verifikasi pembayaran</text>

  <rect x="375" y="165" width="850" height="650" class="box"/>
  <text x="800" y="210" text-anchor="middle" class="title" font-size="32">Website Laravel Khaybar Tour</text>

  <rect x="430" y="250" width="190" height="95" class="process"/>
  <text x="525" y="286" text-anchor="middle" class="label">Paket Umroh</text>
  <text x="525" y="313" text-anchor="middle" class="small">Daftar dan detail</text>

  <rect x="680" y="250" width="190" height="95" class="process"/>
  <text x="775" y="286" text-anchor="middle" class="label">Registrasi/Login</text>
  <text x="775" y="313" text-anchor="middle" class="small">Akun pelanggan</text>

  <rect x="930" y="250" width="190" height="95" class="process"/>
  <text x="1025" y="286" text-anchor="middle" class="label">Pendaftaran</text>
  <text x="1025" y="313" text-anchor="middle" class="small">Pilih paket dan kuota</text>

  <rect x="430" y="390" width="190" height="95" class="process"/>
  <text x="525" y="426" text-anchor="middle" class="label">Data Jamaah</text>
  <text x="525" y="453" text-anchor="middle" class="small">NIK per jamaah</text>

  <rect x="680" y="390" width="190" height="95" class="warn"/>
  <text x="775" y="426" text-anchor="middle" class="label">Pembayaran Awal</text>
  <text x="775" y="453" text-anchor="middle" class="small">DP 30%</text>

  <rect x="930" y="390" width="190" height="95" class="warn"/>
  <text x="1025" y="426" text-anchor="middle" class="label">Pilihan Lanjutan</text>
  <text x="1025" y="453" text-anchor="middle" class="small">Pelunasan / Cicilan 4x</text>

  <rect x="430" y="540" width="190" height="95" class="success"/>
  <text x="525" y="576" text-anchor="middle" class="label">Upload Dokumen</text>
  <text x="525" y="603" text-anchor="middle" class="small">Aktif setelah DP valid</text>

  <rect x="680" y="540" width="190" height="95" class="process"/>
  <text x="775" y="576" text-anchor="middle" class="label">Verifikasi Admin</text>
  <text x="775" y="603" text-anchor="middle" class="small">Dokumen dan bayar</text>

  <rect x="930" y="540" width="190" height="95" class="success"/>
  <text x="1025" y="576" text-anchor="middle" class="label">Invoice</text>
  <text x="1025" y="603" text-anchor="middle" class="small">Total tagihan/dibayar</text>

  <rect x="680" y="680" width="190" height="95" class="process"/>
  <text x="775" y="716" text-anchor="middle" class="label">Laporan Admin</text>
  <text x="775" y="743" text-anchor="middle" class="small">Pendaftaran, bayar, jamaah</text>

  <path class="arrow" d="M305 290 C340 290, 365 290, 420 290"/>
  <path class="arrow" d="M620 298 H670"/>
  <path class="arrow" d="M870 298 H920"/>
  <path class="arrow" d="M1025 345 V383"/>
  <path class="arrow" d="M930 438 H880"/>
  <path class="arrow" d="M680 438 H620"/>
  <path class="arrow2" d="M525 485 V530"/>
  <path class="arrow" d="M620 588 H670"/>
  <path class="arrow" d="M870 588 H920"/>
  <path class="arrow3" d="M1120 590 C1190 590, 1230 510, 1275 460"/>
  <path class="arrow3" d="M1285 435 C1215 435, 1190 438, 1130 438"/>
  <path class="arrow" d="M1025 485 V530"/>
  <path class="arrow" d="M1025 635 C1000 690, 925 720, 880 728"/>
  <path class="arrow" d="M775 635 V670"/>
  <path class="arrow" d="M305 645 C355 645, 370 570, 420 438"/>

  <rect x="580" y="850" width="440" height="110" class="db"/>
  <text x="800" y="892" text-anchor="middle" class="text">Database MySQL</text>
  <text x="800" y="922" text-anchor="middle" class="small">users, paket_umroh, pendaftarans, jamaahs, dokumens, pembayarans, cicilans, invoices</text>
  <path class="arrow3" d="M800 815 V845"/>
  <path class="arrow3" d="M1025 635 C1080 760, 980 840, 910 850"/>

  <rect x="55" y="835" width="410" height="95" class="box"/>
  <text x="260" y="870" text-anchor="middle" class="text">Aturan Penting</text>
  <text x="260" y="898" text-anchor="middle" class="small">Dokumen hanya dapat diupload setelah pembayaran awal valid.</text>
  <text x="260" y="922" text-anchor="middle" class="small">Pembayaran lanjutan: pelunasan langsung atau cicilan maksimal 4x.</text>

  <rect x="1135" y="720" width="400" height="145" class="box"/>
  <text x="1335" y="758" text-anchor="middle" class="text">Output Sistem</text>
  <text x="1335" y="790" text-anchor="middle" class="small">Status pendaftaran</text>
  <text x="1335" y="816" text-anchor="middle" class="small">Status dokumen dan pembayaran</text>
  <text x="1335" y="842" text-anchor="middle" class="small">Invoice dan laporan cetak</text>
</svg>
